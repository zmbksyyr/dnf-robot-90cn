<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TW Robot Web</title><!-- APP_CSS --></head><body>
<header><b data-i18n="page.title">TW Robot Web</b><span id="robotUptimeHead">Runtime -</span><button id="compatButton" class="headlink" data-i18n="header.compat" onclick="openCompatDialog()">Compat</button><button class="headlink" style="margin-left:0" data-i18n="header.ports" onclick="openPortsDialog()">Ports</button><button class="headlink" style="margin-left:0" data-i18n="header.diag" onclick="openDiagnosticsDialog()">Diag</button><button id="dangerousDeleteButton" class="headlink" style="margin-left:0;color:#ff8a8a;font-weight:700" data-i18n="header.purge" onclick="openDangerousDeleteUnlock()">Purge</button><button id="languageButton" class="headlink" style="margin-left:0" onclick="toggleLanguage()">中文</button><a href="/logout" data-i18n="header.logout">Logout</a></header>
<div class="wrap">
<div class="cards"><div class="card" id="mRobot"><div class="k" data-i18n="card.robot">Robot</div><div class="v">-</div></div><div class="card" id="mGame"><div class="k" data-i18n="card.game_port">Game port</div><div class="v">-</div></div><div class="card" id="mMonitor"><div class="k" data-i18n="card.services">Services</div><div class="v service-lights">-</div></div><div class="card" id="mDB"><div class="k" data-i18n="card.database">Database</div><div class="v">-</div></div><div class="card" id="mKey"><div class="k" data-i18n="card.key">Key</div><div class="v">-</div></div><div class="card"><div class="k" data-i18n="card.auto">Auto</div><div class="v" id="mAuto">-</div></div><div class="card" id="mOnlineCard"><div class="k" id="mOnlineLabel" data-i18n="card.online_target">Online / Target</div><div class="v" id="mOnline">-</div></div><div class="card"><div class="k" data-i18n="card.store">Store (Item / Disjoint)</div><div class="v" id="mStore">-</div></div></div>
<div class="toolbar"><button class="primary" data-i18n="action.refresh" onclick="refreshAll()">Refresh</button><button data-key-action="1" data-i18n="action.auto" onclick="openAutoDialog()">Auto</button><button data-key-action="1" data-i18n="action.online" onclick="openOnlineDialog()">Online</button><button data-key-action="1" data-i18n="action.move" onclick="runAction('robotsMove')">Move</button><button data-key-action="1" data-i18n="action.shout" onclick="runAction('robotsShout')">Shout</button><button data-key-action="1" data-i18n="action.store" onclick="runAction('robotsStoreAsync')">Store</button><button data-key-action="1" data-i18n="action.logout" onclick="runAction('robotsLogoutAsync')">Logout</button><button id="cleanupButton" class="danger" data-i18n="action.cleanup" onclick="openCleanupDialog()">Cleanup</button><button id="keyButton" data-i18n="action.key" onclick="openKeyDialog()">Key</button><button id="maxButton" data-i18n="action.max" title="Updates max_user_num in all cfg files under the df_game_r cfg directory.&#10;Maximum is 600. Changes take effect after restarting /root/run." onclick="openMaxDialog()">Max</button><button id="scriptButton" data-i18n="action.script" onclick="openScriptDialog()">Script</button><button id="marketButton" data-i18n="action.market" onclick="openMarketDialog()">Market</button><button id="partyCompatButton" data-i18n="action.party" onclick="openPartyCompatDialog()">Party</button><span class="spacer"></span><label><select id="autoRefreshInterval" onchange="toggleAutoRefresh()"><option value="3000">3s</option><option value="5000">5s</option><option value="8000" selected>8s</option><option value="off" data-i18n="common.off">Off</option></select> <span data-i18n="toolbar.auto_refresh">Auto refresh</span></label><label><span data-i18n="toolbar.count">Count</span> <input id="actionCount" type="number" min="1" max="1000" value="1"></label><span class="muted" id="selectedInfo">Selected 0</span></div>
<div class="scheduler" data-i18n-skip><div class="schedgrid"><div class="scheditem"><div class="k">Policy</div><div class="v" id="sMode">-</div></div><div class="scheditem"><div class="k">Attach</div><div class="v" id="sOnline">-</div></div><div class="scheditem"><div class="k">Store</div><div class="v" id="sStore">-</div></div><div class="scheditem"><div class="k">Scale</div><div class="v" id="sScale">-</div></div><div class="scheditem"><div class="k">Pressure</div><div class="v" id="sPressure">-</div></div><div class="scheditem"><div class="k">Release</div><div class="v" id="sRelease">-</div></div></div><div class="schedreason" id="sReason">-</div></div>
<div class="grid"><div class="panel"><div class="panelhead"><h3 data-i18n="robots.title">Robots</h3><span id="listInfo">-</span></div><div class="tablebox"><table id="tbl"><thead><tr><th><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)"></th><th>UID</th><th>CID</th><th data-i18n="robots.name">Name</th><th data-i18n="robots.actor">Actor</th><th data-i18n="robots.state">State</th><th data-i18n="robots.level">Level</th><th data-i18n="robots.job">Job</th><th data-i18n="robots.town">Town</th><th data-i18n="robots.area">Area</th><th>X</th><th>Y</th><th data-i18n="robots.uptime">Uptime</th><th data-i18n-skip>Store</th></tr></thead><tbody></tbody></table></div></div></div></div>
<dialog id="modal"><div class="dlghead"><h3 id="modalTitle"></h3><button id="modalSaveButton" class="primary" style="display:none" onclick="submitMarketSettings()">Save and rebuild</button><button data-i18n="common.close" onclick="closeModal()">Close</button></div><div class="dlgbody" id="modalBody"></div><div class="dlgfoot" id="modalFoot"></div></dialog><div class="toast" id="toast"></div>
<!-- I18N_JS --><!-- APP_JS --></body></html>
