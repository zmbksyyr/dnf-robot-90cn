<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TW Robot Web</title><!-- APP_CSS --></head><body>
<header><b data-i18n="page.title">TW Robot Web</b><span id="robotUptimeHead">Runtime -</span><span class="header-actions-spacer"></span><button id="backendButton" class="headlink" onclick="openBackendDialog()">S4A21</button><button id="populationButton" class="headlink" data-i18n="header.statistics" onclick="openPopulationReport()">Statistics</button><button id="dangerousDeleteButton" class="headlink danger-link" data-i18n="header.purge" onclick="openDangerousDeleteUnlock()">Purge</button><button id="stopButton" class="headlink danger-link" data-i18n="header.stop" onclick="stopRobot()">Stop</button><button id="languageButton" class="headlink" onclick="toggleLanguage()">中文</button><button class="headlink" data-i18n="header.logout" onclick="logoutWebSession()">Logout</button></header>
<div class="wrap">
<div class="cards"><div class="card" id="mRobot"><div class="k" data-i18n="card.robot">Robot</div><div class="v">-</div></div><div class="card" id="mGame"><div class="k" data-i18n="card.game_port">Game port</div><div class="v">-</div></div><div class="card" id="mDB"><div class="k" data-i18n="card.database">Database</div><div class="v">-</div></div><div class="card"><div class="k" data-i18n="card.auto">Auto</div><div class="v" id="mAuto">-</div></div><div class="card" id="mOnlineCard"><div class="k" id="mOnlineLabel" data-i18n="card.online_target">Online / Target</div><div class="v" id="mOnline">-</div></div><div class="card" id="mStoreCard"><div class="k" data-i18n="card.store">Store (Item / Disjoint)</div><div class="v" id="mStore">-</div></div></div>
<div class="toolbar"><button class="primary" data-i18n="action.refresh" onclick="refreshAll()">Refresh</button><button data-key-action="1" data-i18n="action.auto" onclick="openAutoDialog()">Auto</button><button data-key-action="1" data-i18n="action.online" onclick="runAction('robotsOnlineAsync')">Online</button><button data-key-action="1" data-i18n="action.move" onclick="runAction('robotsMove')">Move</button><button data-key-action="1" data-i18n="action.shout" onclick="runAction('robotsShout')">Shout</button><button data-key-action="1" data-i18n="action.store" onclick="runAction('robotsStoreAsync')">Store</button><button data-key-action="1" data-i18n="action.logout" onclick="runAction('robotsLogoutAsync')">Logout</button><button id="cleanupButton" class="danger" data-i18n="action.cleanup" onclick="openCleanupDialog()">Cleanup</button><span class="spacer"></span><label><select id="autoRefreshInterval" onchange="toggleAutoRefresh()"><option value="3000">3s</option><option value="5000">5s</option><option value="8000" selected>8s</option><option value="off" data-i18n="common.off">Off</option></select> <span data-i18n="toolbar.auto_refresh">Auto refresh</span></label><span class="muted" id="selectedInfo">Selected 0</span></div>
<div class="scheduler"><div class="schedgrid"><div class="scheditem" title="Policy mode: current scheduler phase"><div class="k" data-i18n="scheduler.policy_mode">Policy</div><div class="v" id="sMode">-</div></div><div class="scheditem" title="Attach pace: logins per second · batch size"><div class="k" data-i18n="scheduler.attach_pace">Attach</div><div class="v" id="sOnline">-</div></div><div class="scheditem" title="Store policy: running/target · concurrency · probability"><div class="k" data-i18n="scheduler.store_policy">Stall</div><div class="v" id="sStore">-</div></div><div class="scheditem" title="Scale window: scale up batch / scale down batch"><div class="k" data-i18n="scheduler.scale_window">Scale</div><div class="v" id="sScale">-</div></div><div class="scheditem" title="Pressure guard: connecting count · CPU usage"><div class="k" data-i18n="scheduler.pressure_guard">Pressure</div><div class="v" id="sPressure">-</div></div><div class="scheditem" title="Release guard: breaker release batch · port release batch"><div class="k" data-i18n="scheduler.release_guard">Release</div><div class="v" id="sRelease">-</div></div></div><div class="schedreason" id="sReason">-</div></div>
<div class="grid"><div class="panel"><div class="panelhead"><h3 data-i18n="robots.title">Robots</h3><span id="listInfo">-</span></div><div class="tablebox"><table id="tbl"><thead><tr><th><input type="checkbox" id="checkAll" onchange="toggleAll(this.checked)"></th><th>UID</th><th>CID</th><th data-i18n="robots.name">Name</th><th data-i18n="robots.actor">Actor</th><th data-i18n="robots.state">State</th><th data-i18n="robots.level">Level</th><th data-i18n="robots.job">Job</th><th data-i18n="robots.town">Town</th><th data-i18n="robots.area">Area</th><th>X</th><th>Y</th><th data-i18n="robots.uptime">Uptime</th><th data-i18n="robots.store">Store</th></tr></thead><tbody></tbody></table></div></div></div></div>
<dialog id="modal"><div class="dlghead"><h3 id="modalTitle"></h3><button data-i18n="common.close" onclick="closeModal()">Close</button></div><div class="dlgbody" id="modalBody"></div><div class="dlgfoot" id="modalFoot"></div></dialog><div class="toast" id="toast"></div>
<!-- I18N_JS --><!-- APP_JS --></body></html>
