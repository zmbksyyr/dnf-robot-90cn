name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tools/deploy-launcher/go.sum

      - name: Test main project
        run: go test ./...

      - name: Test deploy launcher
        working-directory: tools/deploy-launcher
        run: go test ./...

      - name: Prepare package
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path dist/package | Out-Null

      - name: Build Linux and Windows robots
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOARCH = "amd64"

          $env:GOOS = "linux"
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/package/robot ./cmd/robot

          $env:GOOS = "windows"
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist/package/robot.exe ./cmd/robot

      - name: Generate deploy launcher manifest resource
        working-directory: tools/deploy-launcher
        shell: pwsh
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest app.manifest -o rsrc.syso

      - name: Build deploy launcher
        working-directory: tools/deploy-launcher
        shell: pwsh
        run: go build -trimpath -buildvcs=false -ldflags="-s -w -H windowsgui" -o ../../dist/package/deploy-launcher.exe .

      - name: Package release archive
        shell: pwsh
        run: |
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, "China Standard Time").ToString("yyyyMMdd")
          $archive = "dofrobot-main_$date.zip"
          Compress-Archive -Path dist/package/* -DestinationPath "dist/$archive" -Force
          Remove-Item -LiteralPath dist/package -Recurse -Force
          "RELEASE_ZIP=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Delete previous latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "latest"
          $release = gh release view $tag --json id --jq .id 2>$null
          if ($LASTEXITCODE -eq 0 -and $release) {
            gh release delete $tag -y
            git push --delete origin $tag 2>$null
          }
          $global:LASTEXITCODE = 0

      - name: Create latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "latest"
          git tag -f $tag
          git push -f origin $tag

          $releaseReady = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release create $tag `
              --verify-tag `
              --title "Latest Build" `
              --notes "Auto-built from main branch"
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }

            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              $releaseReady = $true
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $releaseReady) {
            throw "Failed to create release $tag after 3 attempts"
          }

          $assetsUploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $tag `
              --clobber `
              "dist/$env:RELEASE_ZIP"
            if ($LASTEXITCODE -eq 0) {
              $assetsUploaded = $true
              break
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          if (-not $assetsUploaded) {
            throw "Failed to upload release assets after 3 attempts"
          }
